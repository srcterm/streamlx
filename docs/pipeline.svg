.slot{fill:var(--box);stroke:var(--line)}
.hit{fill:var(--soft);stroke:var(--acc);stroke-width:1.5}
.miss{fill:var(--acc);stroke:var(--acc)}
.dense{fill:var(--line)}
.tensor{fill:var(--box);stroke:var(--line);stroke-width:.8}
.row{stroke:var(--line);stroke-width:.6}
.hot{fill:var(--acc)}
.t{fill:var(--ink);font-size:14px;font-weight:600}
.n{fill:var(--ink);font-size:13px}
.b{fill:var(--muted);font-size:12px}
.lab{fill:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em}
.a{fill:none;stroke:var(--muted);stroke-width:1.3}
.ax{fill:none;stroke:var(--acc);stroke-width:1.6}
.dash{stroke-dasharray:4 3}
.ahf{fill:var(--muted)}
.ahx{fill:var(--acc)}
