[project]
name = "streamlx"
version = "0.1.0"
description = "A lightweight SSD-streaming engine for MoE models on Apple Silicon: serve models larger than RAM"
requires-python = ">=3.10"
dependencies = ["mlx-lm>=0.31", "mlx-vlm", "numpy"]

[project.scripts]
streamlx = "streamlx.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["streamlx"]
